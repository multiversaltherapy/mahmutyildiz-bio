<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahmut YILDIZ | Motion Graphics & Art Director</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        /* Premium CSS & Animations */
        :root {
            --surface: rgba(255, 255, 255, 0.04);
            --surface-hover: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: #050505;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            overflow-x: hidden;
        }

        /* Animated Mesh Gradient Background */
        .premium-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: 
                radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(168, 85, 247, 0.15), transparent 25%);
            z-index: -1;
            animation: bgShift 15s ease-in-out infinite alternate;
        }

        @keyframes bgShift {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.2); opacity: 1; }
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: rgba(10, 10, 10, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 3.5rem 2.5rem;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Profile Header */
        .profile {
            text-align: center;
            margin-bottom: 3rem;
        }

        .avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.2);
            padding: 6px;
            margin-bottom: 1.5rem;
            box-shadow: 0 0 40px rgba(255,255,255,0.05);
            transition: transform 0.5s ease;
        }

        .avatar:hover {
            transform: scale(1.05) rotate(2deg);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
            background: linear-gradient(180deg, #FFFFFF 0%, #A1A1AA 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h2 {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 1.5rem;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
        }

        .tag {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 0.4rem 1rem;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 500;
            color: #d4d4d8;
        }

        /* Links */
        .links {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .link-btn {
            position: relative;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 1.25rem 1.5rem;
            border-radius: 20px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 500;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
            cursor: pointer;
        }

        .link-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }

        .link-btn::after {
            content: '↗';
            position: absolute;
            right: 1.5rem;
            opacity: 0.3;
            transition: all 0.4s ease;
        }

        .link-btn:hover {
            background: var(--surface-hover);
            border-color: rgba(255,255,255,0.25);
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .link-btn:hover::before {
            transform: translateX(100%);
        }

        .link-btn:hover::after {
            opacity: 1;
            transform: translate(3px, -3px);
        }

        .primary {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <div class="premium-bg"></div>

    <div class="container">
        <div class="profile">
            <img src="1653991906086.jpg" alt="Mahmut YILDIZ" class="avatar">
            <h1>Mahmut YILDIZ</h1>
            <h2>Motion Graphics & Art Director</h2>
            
            <div class="tags">
                <span class="tag">After Effects</span>
                <span class="tag">Premiere Pro</span>
                <span class="tag">Blender 3D</span>
                <span class="tag">Figma</span>
            </div>
        </div>

        <div class="links">
            <a href="https://drive.google.com/drive/folders/1kvDRnTHOB1jaCW8cut39Rl9vA3BqTPwo" class="link-btn primary" target="_blank" rel="noopener noreferrer">Portfolyo</a>
            <a href="https://www.linkedin.com/in/mahmut-yıldız-054a64218/" class="link-btn" target="_blank" rel="noopener noreferrer">LinkedIn</a>
            <a href="https://drive.google.com/file/d/13dgLqtZXOTRXY5dIBDj-fsghl_nepEIz/view?usp=drive_link" class="link-btn" target="_blank" rel="noopener noreferrer">CV</a>
            <a href="https://olabenja.com/" class="link-btn" target="_blank" rel="noopener noreferrer">OLABENJA</a>
            <a href="javascript:void(0)" class="link-btn" id="contactBtn">İletişim</a>
        </div>
    </div>

    <!-- JavaScript Copy to Clipboard Module -->
    <script>
        document.getElementById('contactBtn').addEventListener('click', function(e) {
            e.preventDefault();
            const email = "mahmutyldzz5311@gmail.com";
            
            navigator.clipboard.writeText(email).then(() => {
                const originalText = this.innerText;
                this.innerText = "Kopyalandı! ✓";
                this.style.background = "rgba(255, 255, 255, 0.15)";
                this.style.borderColor = "rgba(255, 255, 255, 0.5)";
                
                setTimeout(() => {
                    this.innerText = originalText;
                    this.style.background = "";
                    this.style.borderColor = "";
                }, 2000);
            }).catch(err => {
                console.error('Kopyalama işlemi başarısız: ', err);
            });
        });
    </script>
</body>
</html>
