<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahmut YILDIZ | Motion Graphics & Art Director</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030712;
            --glass-bg: rgba(17, 24, 39, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --accent-1: #6366f1;
            --accent-2: #a855f7;
            --accent-3: #ec4899;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 2rem 1rem;
            position: relative;
        }

        .ambient-light {
            position: fixed;
            width: 40vw;
            height: 40vw;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.4;
            z-index: -1;
            animation: float 10s ease-in-out infinite alternate;
        }

        .light-1 {
            background: var(--accent-1);
            top: -10%;
            left: -10%;
        }

        .light-2 {
            background: var(--accent-3);
            bottom: -10%;
            right: -10%;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(10%, 10%) scale(1.2); }
        }

        .profile-container {
            width: 100%;
            max-width: 420px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 3rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .animate-up {
            opacity: 0;
            transform: translateY(20px);
            animation: slideUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .avatar-wrapper {
            position: relative;
            width: 130px;
            height: 130px;
            margin-bottom: 1.5rem;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-3));
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--bg-color);
            background-color: var(--bg-color);
        }

        .name {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 0.25rem;
            background: linear-gradient(to right, #fff, #d1d5db);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .title {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--accent-2);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 2rem;
            text-align: center;
        }

        .software-stack {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.6rem;
            margin-bottom: 2.5rem;
        }

        .badge {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.5rem 1rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            transition: all 0.3s ease;
        }

        .badge:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent-2);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(168, 85, 247, 0.2);
        }

        .links-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
        }

        .link-card {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center; /* Yazıyı tam ortalar */
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            padding: 1.1rem 1.5rem;
            border-radius: 16px;
            text-decoration: none;
            color: var(--text-primary);
            font-weight: 600;
            font-size: 1rem;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Sağdaki ok ikonunu bağımsız hale getirdik */
        .link-card::after {
            content: '→';
            position: absolute;
            right: 1.5rem;
            font-size: 1.2rem;
            opacity: 0.5;
            transition: all 0.4s ease;
        }

        .link-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: scale(1.02);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        .link-card:hover::after {
            opacity: 1;
            transform: translateX(4px);
            color: var(--accent-3);
        }

        .link-card.primary {
            background: linear-gradient(90deg, rgba(99, 102, 241, 0.1), rgba(168, 85, 247, 0.1));
            border-color: rgba(168, 85, 247, 0.3);
        }

        .link-card.primary:hover {
            background: linear-gradient(90deg, rgba(99, 102, 241, 0.2), rgba(168, 85, 247, 0.2));
            border-color: rgba(168, 85, 247, 0.6);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.2);
        }
    </style>
</head>
<body>
    
    <div class="ambient-light light-1"></div>
    <div class="ambient-light light-2"></div>

    <main class="profile-container animate-up">
        
        <div class="avatar-wrapper animate-up delay-1">
            <img src="1653991906086.jpg" alt="Mahmut YILDIZ" class="avatar">
        </div>

        <h1 class="name animate-up delay-1">Mahmut YILDIZ</h1>
        <h2 class="title animate-up delay-2">Motion Graphics & Art Director</h2>

        <div class="software-stack animate-up delay-3">
            <div class="badge">After Effects</div>
            <div class="badge">Premiere Pro</div>
            <div class="badge">Photoshop</div>
            <div class="badge">Blender 3D</div>
            <div class="badge">Capcut</div>
            <div class="badge">Figma</div>
        </div>

        <nav class="links-grid animate-up delay-4">
            <a href="https://drive.google.com/drive/folders/1kvDRnTHOB1jaCW8cut39Rl9vA3BqTPwo" class="link-card primary" target="_blank" rel="noopener noreferrer">Portfolyo</a>
            <a href="https://www.linkedin.com/in/mahmut-yıldız-054a64218/" class="link-card" target="_blank" rel="noopener noreferrer">LinkedIn</a>
            <a href="https://drive.google.com/file/d/13dgLqtZXOTRXY5dIBDj-fsghl_nepEIz/view?usp=drive_link" class="link-card" target="_blank" rel="noopener noreferrer">CV</a>
            <a href="https://olabenja.com/" class="link-card" target="_blank" rel="noopener noreferrer">OLABENJA</a>
            <a href="mailto:mahmutyldzz5311@gmail.com" class="link-card">İletişim</a>
        </nav>

    </main>

</body>
</html>
