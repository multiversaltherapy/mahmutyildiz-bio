<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahmut YILDIZ | Motion Graphics Designer & Art Director</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #141c2f;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-primary: #38bdf8;
            --accent-secondary: #818cf8;
            --btn-bg: rgba(255, 255, 255, 0.05);
            --btn-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top, #1e293b 0%, #0b0f19 70%);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container {
            background: var(--card-bg);
            max-width: 440px;
            width: 100%;
            border-radius: 24px;
            padding: 3rem 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            text-align: center;
            border: 1px solid var(--btn-border);
        }

        .profile-img-container {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 1.5rem auto;
        }

        .profile-img-container::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            z-index: -1;
            animation: spin 4s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--card-bg);
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            letter-spacing: -0.025em;
        }

        h2 {
            font-size: 1rem;
            font-weight: 500;
            color: var(--accent-primary);
            margin-bottom: 1.5rem;
        }

        .skills-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 2.5rem;
        }

        .skill-badge {
            background: var(--btn-bg);
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 500;
            padding: 0.4rem 0.8rem;
            border-radius: 9999px;
            border: 1px solid var(--btn-border);
            transition: color 0.3s ease, border-color 0.3s ease;
        }

        .skill-badge:hover {
            color: var(--text-main);
            border-color: var(--accent-secondary);
        }

        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--btn-bg);
            color: var(--text-main);
            text-decoration: none;
            padding: 1rem;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--btn-border);
            position: relative;
            overflow: hidden;
        }

        .link-btn:hover {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: #ffffff;
            border-color: transparent;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px -5px rgba(56, 189, 248, 0.5);
        }

        .link-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-img-container">
            <img src="1653991906086.jpg" alt="Mahmut YILDIZ" class="profile-img">
        </div>
        
        <h1>Mahmut YILDIZ</h1>
        <h2>Motion Graphics Designer & Art Director</h2>
        
        <div class="skills-container">
            <span class="skill-badge">After Effects</span>
            <span class="skill-badge">Premiere Pro</span>
            <span class="skill-badge">Photoshop</span>
            <span class="skill-badge">Blender 3D</span>
            <span class="skill-badge">Capcut</span>
            <span class="skill-badge">Figma</span>
        </div>

        <div class="links-wrapper">

            <a href="https://drive.google.com/file/d/13dgLqtZXOTRXY5dIBDj-fsghl_nepEIz/view?usp=drive_link" class="link-btn" target="_blank" rel="noopener noreferrer">CV</a>
            <a href="https://olabenja.com/" class="link-btn" target="_blank" rel="noopener noreferrer">OLABENJA</a>
            <a href="mailto:mahmutyldzz5311@gmail.com" class="link-btn">İletişim</a>
        </div>
    </div>
</body>
